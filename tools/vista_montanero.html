<!doctype html><html><head><meta charset="utf-8"><title>Vista montañero</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/" } }</script>
<style>body{margin:0;background:#9fb3c4}</style></head><body>
<script type="module">
// Herramienta de desarrollo: muestra los tres montañeros en varias posturas (?pose=andar|arista|cuatro)
import * as THREE from 'three';
import { crearMontanero } from '../js/montanero.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1100, 640); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#9fb3c4');
sc.add(new THREE.HemisphereLight(0xe6eef6, 0x6d7466, 2.4)); const s = new THREE.DirectionalLight(0xffffff, 2.0); s.position.set(3, 5, 4); sc.add(s);
const cam = new THREE.PerspectiveCamera(30, 1100 / 640, 0.1, 100); cam.position.set(4.2, 1.6, 5.2); cam.lookAt(0, 0.85, 0);
const pose = new URLSearchParams(location.search).get('pose') || 'andar';
const defs = [{ chaqueta: '#b8392e', mochila: '#d9822b', mochilaTipo: 'grande', palos: 2 }, { chaqueta: '#2d5f8f', mochila: '#3b7a55', pantalon: '#363a42', mochilaTipo: 'pequena', palos: 0 }, { chaqueta: '#c9962a', mochila: '#5a4a7a', pantalon: '#2f3a33', mochilaTipo: 'media', palos: 1 }];
defs.forEach((d, i) => { const m = crearMontanero(d); m.group.position.x = (i - 1) * 1.3; m.group.rotation.y = i === 1 ? 0.5 : i === 0 ? -0.5 : 1.6;
  const c = pose === 'arista' ? { agach: 0.8, manos: 1, cuatro: 0 } : pose === 'cuatro' ? { agach: 0.8, manos: 1, cuatro: 1 } : null;
  m.pose(1.0 + i * 1.2, pose === 'quieto' ? 0 : 1, 0, c); sc.add(m.group); });
const g = new THREE.Mesh(new THREE.CircleGeometry(4, 32), new THREE.MeshStandardMaterial({ color: '#8a8478' })); g.rotation.x = -Math.PI / 2; sc.add(g);
r.render(sc, cam); document.title = 'ok';
</script></body></html>
